/* Mantiene los personajes ya descargados y decodificados en memoria para que aparezcan al instante */
(function(){
  window.lbPJ=[];
  for(var i=1;i<=9;i++){
    (function(n){
      var im=new Image(); im.decoding='async'; im.src='personajes/personaje'+n+'.png';
      if(n===1) im.fetchPriority='high';

<script>
/* Modo de pantalla: auto (según el ancho), celular o computadora */
(function(){
  var d=document.documentElement, vp=document.getElementById('lb-vp'), NORMAL=vp.getAttribute('content');
  var phone=window.matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=860; window.lbPhone=phone;
  function get(){try{return localStorage.getItem('lb-mode')||'auto'}catch(e){return 'auto'}}
  function apply(){
    var p=get(), m=p==='auto'?(window.innerWidth<=860?'mobile':'desktop'):p;
    d.setAttribute('data-mode',m); d.setAttribute('data-mode-pref',p);
    d.setAttribute('data-phone',phone?'1':'0');
    /* Lienzo de referencia del celular: 390 px de ancho, escalado igual en todos los teléfonos */
    var w=window.innerWidth, canvas=(m==='mobile'&&(w<=500||w>860)), zf=(m==='mobile'&&w<=500)?Math.max(.7,w/390):1;
    d.setAttribute('data-canvas',canvas?'1':'0'); d.style.setProperty('--zf',zf.toFixed(4));
    /* En un teléfono forzado a modo computadora, se muestra la página ancha */
    vp.setAttribute('content',(p==='desktop'&&phone)?'width=1180, viewport-fit=cover':NORMAL);
  }
  window.lbSetMode=function(p){try{localStorage.setItem('lb-mode',p)}catch(e){} apply();};
  window.addEventListener('resize',apply);
  apply();
})();
</script>

<style>
:root{
  --navy:#1D4540; --navy2:#2A5A53; --yellow:#F6BC45; --yellow-d:#D99A1C;
  color-scheme:light; --bg:#FAF8F3; --panel:#FFFFFF; --text:#1D2B3A; --muted:#5E6B78; --line:#E7DFD1;
  --blue:#3B82F6; --green:#22B573; --purple:#8B5CF6; --orange:#F59E0B; --pink:#F0527A; --red:#E5484D;
  --ok:#1E9E62; --okbg:#DDF5E8;
  --vw:1vw; --vh:1vh;
  --f-head:"Nunito","Trebuchet MS",system-ui,sans-serif; --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;

}
:root[data-theme="dark"]{
  --bg:#121C26; --panel:#1A2733; --text:#EAF1F5; --muted:#A3B3BF; --line:#2B3B4A; --okbg:#12392B; --ok:#4BD28F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0}

.sr{position:absolute;left:-9999px}

/* ---------- Botones ---------- */

.btn:hover{transform:translateY(-2px)}

.btn-y{background:var(--yellow);color:#2A1D00;box-shadow:0 4px 0 var(--yellow-d)}
.btn-b{background:var(--blue);color:#fff}
.btn-p{background:var(--purple);color:#fff}
.btn-g{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn-big{font-size:1.5rem;padding:.8rem 2.4rem;font-family:var(--f-head)}
.arrow{width:1.1em;height:1.1em}

/* ---------- Inicio ---------- */
.home{min-height:calc(100*var(--vh));background:radial-gradient(900px 560px at 26% 58%,#21428F 0,#132552 46%,#0A1330 100%);color:#fff;display:grid;grid-template-columns:minmax(300px,1.15fr) minmax(330px,1.1fr) minmax(260px,.85fr);gap:1.5rem;align-items:center;padding:3rem 3rem 3rem 0;overflow:hidden;position:relative;isolation:isolate}
.home::before{content:"";position:absolute;z-index:-1;left:6%;bottom:-150px;width:58%;height:300px;border-radius:50%;background:radial-gradient(closest-side,#2450C4 0,#1B3A9A 55%,rgba(27,58,154,0) 100%);opacity:.8}
.home::after{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 78% 18%,rgba(120,160,255,.14) 0,transparent 35%);pointer-events:none}
.home-art{position:relative;align-self:stretch;min-height:460px}
.home-art .mitoB{position:absolute;left:-42%;top:50%;width:150%;max-width:640px;transform:translateY(-50%)}
.home-art .prof{position:absolute;left:36%;bottom:2%;width:clamp(150px,56%,250px);animation:hfloat 3.2s ease-in-out infinite}
@keyframes hfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes htwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.home-main{text-align:center;position:relative;padding-top:1rem}
.logo{font-family:var(--f-head);font-weight:800;font-size:clamp(3rem,calc(5.2*var(--vw)),5rem);line-height:1;letter-spacing:-1px;display:inline-flex;align-items:flex-end;margin:0;color:#fff;-webkit-text-stroke:.09em #0A1330;paint-order:stroke fill;text-shadow:0 .06em 0 #0A1330,0 .1em .2em rgba(0,0,0,.35)}
.logo b{color:var(--yellow);font-weight:800;position:relative;display:inline-block}
.logo .lk{position:absolute;right:-.2em;top:-.1em;width:.46em;height:.5em;-webkit-text-stroke:0;filter:drop-shadow(0 .03em 0 #0A1330)}
.home h2{font-size:clamp(1.5rem,calc(2.6*var(--vw)),2.1rem);margin:1.1rem 0 .2rem;font-weight:700}
.home .tag{color:#9FB2EC;margin:0 0 1.6rem;font-size:1.1rem}
.home .btn-big{padding:.7rem 2.6rem;box-shadow:0 5px 0 #C98A00,0 12px 24px rgba(0,0,0,.35)}
.spk{position:absolute;pointer-events:none}
.s1{width:46px;left:4%;top:-6px}
.s2{width:30px;right:6%;bottom:-6px;animation:htwinkle 2.4s ease-in-out infinite}
.s3{width:60px;right:-2%;top:10px}
.home-list{display:grid;gap:.85rem}
.pill{display:flex;align-items:center;gap:.8rem;background:linear-gradient(180deg,rgba(120,150,220,.30),rgba(80,110,190,.22));border:1px solid rgba(160,185,245,.25);border-radius:18px;padding:.5rem 1rem .5rem .5rem;font-weight:800;text-align:left;color:#fff;width:100%;font-size:.98rem;line-height:1.2;box-shadow:0 4px 14px rgba(5,10,30,.3);transition:transform .15s,background .15s}
.pill:hover{background:linear-gradient(180deg,rgba(140,170,240,.42),rgba(100,130,210,.32));transform:translateX(-4px)}
.pill .ic{width:50px;height:50px;flex:none;display:block}
.pill .ic svg{width:50px;height:50px}

/* ---------- App ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100*var(--vh))}
.side{background:var(--navy);color:#fff;padding:1.4rem 1rem;position:sticky;top:0;height:calc(100*var(--vh));align-self:start;display:flex;flex-direction:column;gap:1.4rem}

.nav{display:grid;gap:.35rem}

.main{padding:2rem clamp(1rem,calc(3*var(--vw)),2.6rem) 3rem;max-width:1100px;width:100%}
.main h1{font-size:clamp(1.7rem,calc(3*var(--vw)),2.3rem);margin-bottom:1.2rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:1.2rem 1.4rem}
.note{color:var(--muted);font-size:.95rem}
.foot{margin-top:2rem;color:var(--muted);font-size:.9rem;max-width:70ch}

/* menú */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1.1rem}
.mcard{border:0;border-radius:26px;padding:1.5rem 1.2rem;color:#fff;text-align:center;display:grid;gap:.6rem;justify-items:center;min-height:270px;align-content:center;transition:transform .15s}
.mcard:hover{transform:translateY(-4px)}
.mcard .ic{width:92px;height:92px;border-radius:26px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.mcard .ic svg{width:52px;height:52px}
.mcard h3{font-size:1.35rem}
.mcard p{margin:0;font-size:.95rem;opacity:.95}
.mcard .go{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}

/* ciclo */
.cycle{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(240px,1fr);gap:1.5rem;align-items:center}
.steps{display:grid;gap:.8rem}
.stepbtn{display:flex;align-items:center;gap:.8rem;border:2px solid transparent;border-radius:16px;padding:.9rem 1rem;font-weight:800;font-size:1.1rem;text-align:left;width:100%;background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.stepbtn:hover{border-color:var(--c)}
.num{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;flex:none}
.hint{display:flex;gap:.7rem;align-items:center;border:2px solid var(--line);border-radius:14px;padding:.7rem .9rem;color:var(--muted);font-size:.95rem}
.mito-wrap svg{width:100%;height:auto}
/* ===== Colores mate (Teoría, Casos clínicos, Evaluación, Recursos) ===== */
.main.mt{--mt-ink:#14285A;--mt-pink:#FADBDD;--mt-green:#D3F3E0;--mt-lav:#E7DBFA;--mt-yel:#F8ECC4;--mt-sky:#D8E8F8;--mt-card:#FBF8EF;--mt-line:#E4DECF}
.mt .card{background:var(--mt-card);border:2px solid var(--mt-line);box-shadow:none;color:var(--mt-ink)}
.mt .card h3,.mt .card p,.mt .story p{color:var(--mt-ink)}
.mt .note{color:#4C5C7C}
.mt .qn{font-size:1.35rem;font-weight:800;color:var(--mt-ink);font-family:var(--f-head)}
.mt .progress.seg{display:flex;gap:3px;background:none;height:20px;border-radius:12px;overflow:hidden;margin:.5rem 0 1.1rem;max-width:420px}
.mt .progress.seg i{flex:1;height:100%;background:#D3E2F2;width:auto}
.mt .progress.seg i.on{background:#3DAA6E}
.mt .opts{display:grid;gap:.8rem}
.mt .opt{--oc:#9AA7C7;background:var(--mt-pink);border:2px solid color-mix(in srgb,var(--mt-pink) 70%,#fff);color:var(--mt-ink);font-weight:800;font-size:1.15rem;border-radius:20px;padding:.8rem 1.1rem;gap:1.2rem;box-shadow:none}
.mt .opt:nth-child(4n+2){--oc:#5DBB8A;background:var(--mt-green);border-color:color-mix(in srgb,var(--mt-green) 70%,#fff)}
.mt .opt:nth-child(4n+3),.mt .opt:nth-child(4n+4){--oc:#B293E8;background:var(--mt-lav);border-color:color-mix(in srgb,var(--mt-lav) 70%,#fff)}
.mt .opt:hover:not(:disabled){filter:brightness(.97);border-color:var(--oc)}
.mt .opt .dot{width:34px;height:34px;border:3px solid var(--oc);background:#fff;color:var(--mt-ink);font-size:1rem;font-weight:800}
.mt .opt.good{background:#BFEBD2;border-color:#5DBB8A}.mt .opt.good .dot{background:#3DAA6E;border-color:#3DAA6E;color:#fff}
.mt .opt.bad{background:#F6C6CA;border-color:#E58A92}.mt .opt.bad .dot{background:#D9626E;border-color:#D9626E;color:#fff}
.mt .opt:disabled{opacity:1}
.mt .fb{background:var(--mt-sky);border-radius:18px;padding:.8rem 1rem;color:var(--mt-ink)}
.mt .chip{background:#F3EFE3;border:2px solid var(--mt-line);color:var(--mt-ink);box-shadow:none}
.mt .chip[aria-pressed="true"]{background:#D9C9F5;border-color:#B293E8;color:#2E1B5E}
.mt .clue{background:var(--mt-pink);border:2px solid transparent;color:var(--mt-ink)}
.mt .clue:nth-child(4n+2){background:var(--mt-green)}.mt .clue:nth-child(4n+3){background:var(--mt-lav)}.mt .clue:nth-child(4n+4){background:var(--mt-yel)}
.mt .clue>button{color:var(--mt-ink)}.mt .clue>button svg{color:#5A6C94}.mt .clue p{color:var(--mt-ink)}
.mt .clue.open{border-color:#B7AFD6}
.mt .theory{background:var(--mt-yel);color:#5A4510}
.mt .search{background:var(--mt-card);border:2px solid var(--mt-line);color:var(--mt-ink);box-shadow:none}
.mt .gl div{background:var(--mt-pink);border:2px solid transparent;color:var(--mt-ink)}
.mt .gl div:nth-child(4n+2){background:var(--mt-green)}.mt .gl div:nth-child(4n+3){background:var(--mt-lav)}.mt .gl div:nth-child(4n+4){background:var(--mt-sky)}
.mt .gl dt{color:var(--mt-ink)}.mt .gl dd{color:#3E4E70}
.mt .bib li{background:var(--mt-green);border:2px solid transparent;color:var(--mt-ink)}
.mt .bib li:nth-child(3n+2){background:var(--mt-lav)}.mt .bib li:nth-child(3n+3){background:var(--mt-pink)}
.mt .bib li::before{background:#fff;color:var(--mt-ink);border:2px solid rgba(20,40,90,.15)}
.mt .bib a{color:#1E5FC9}
.mt .score .big{color:#3DAA6E}
.mt .btn{box-shadow:none}
.mt .btn-y{background:#F1D58A;color:#4A3A10}.mt .btn-p{background:#CDB8F2;color:#2E1B5E}.mt .btn-b{background:#B9D6F5;color:#15325E}
.mt .btn-g{background:transparent;border:2px solid #D4CDB9;color:var(--mt-ink)}

/* ciclo (nuevo diseño) */
.cyHead{position:relative;display:flex;align-items:center;gap:.4rem;margin-bottom:1rem}
.cyT{font-family:var(--f-hand)!important;font-weight:700;font-size:clamp(2.4rem,calc(6*var(--vw)),3.8rem)!important;margin:0!important;color:var(--text);letter-spacing:-.5px}
.cySp{width:38px;height:38px;flex:none}
.cyNew{grid-template-columns:minmax(260px,1.1fr) minmax(280px,1fr);gap:2rem;align-items:center}
.cyMito{position:relative;padding-bottom:3.4rem}

.cyLab{position:absolute;right:6%;bottom:0;display:flex;align-items:flex-end;gap:.2rem;flex-wrap:wrap;width:46%}

.cyUl{width:100%;height:10px;margin-top:-.2rem}
.cySt{--c:var(--n);background:var(--b);border-radius:22px;padding:.8rem 1.2rem .8rem .9rem;gap:1rem;min-height:84px;color:#14285A}

html[data-mode="mobile"] .cyNew{grid-template-columns:1fr}

.mnode{cursor:pointer}
.mnode:hover circle{transform:scale(1.12);transform-origin:center;transform-box:fill-box}

/* reacción */
.tabs{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.tabs i{height:3px;width:28px;background:var(--line);border-radius:3px}
.tabs button{width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--c) 22%,var(--panel));font-weight:800;font-family:var(--f-head);color:var(--text)}
.tabs button[aria-current="step"]{background:var(--c);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.rx{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:1.2rem}
.rx-eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem;padding:1rem 0}
.mol{text-align:center;color:var(--text)}
.mol svg{width:210px;height:auto;max-width:100%}
.mol figcaption{font-weight:700;font-size:.9rem}
.mol-pair{display:grid;gap:.2rem}
.rarrow{text-align:center;font-size:.9rem;font-weight:700;min-width:130px}
.rarrow small{display:block;color:var(--muted);font-weight:700}
.rarrow svg{margin:.2rem auto}
.say{display:flex;gap:.8rem;align-items:flex-start}

.nav-row{display:flex;justify-content:space-between;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.circ{width:44px;height:44px;border-radius:50%;padding:0;justify-content:center}

/* biobloqueo */
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;margin-bottom:1.2rem}
.ebtn{border:3px solid transparent;border-radius:20px;padding:.8rem .6rem;background:color-mix(in srgb,var(--c) 15%,var(--panel));font-weight:800;display:grid;justify-items:center;gap:.2rem;text-align:center;line-height:1.2}
.ebtn[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.ebtn svg{width:80px;height:80px}
.state-row{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.state-btns{display:flex;gap:.6rem;flex-wrap:wrap}
.sbtn{border:2px solid var(--line);border-radius:12px;padding:.6rem 1.2rem;font-weight:800;background:var(--panel)}
.sbtn[aria-pressed="true"].n{background:var(--green);color:#fff;border-color:var(--green)}
.sbtn[aria-pressed="true"].r{background:var(--orange);color:#2A1D00;border-color:var(--orange)}
.sbtn[aria-pressed="true"].b{background:var(--red);color:#fff;border-color:var(--red)}
.sim-mascot{display:flex;align-items:center;gap:.6rem}
.sim-mascot svg{width:110px;height:110px}
.epj{display:inline-grid;place-items:center;width:100%;height:100%;transform-origin:50% 90%}
.epj>img,.epj>svg{grid-area:1/1;width:100%;height:100%;object-fit:contain;overflow:visible}
.ebtn .epj{width:80px;height:80px}
.sim-mascot .epj{width:110px;height:110px}
.fb .epj{width:84px;height:84px;flex:none}
.opt .epj{width:46px;height:46px}
.say .epj{width:96px;height:96px}
.epj.m-ok{animation:epjfloat 3.2s ease-in-out infinite}
.epj.m-reduced{animation:epjslow 2.6s ease-in-out infinite}
.epj.m-blocked{animation:epjshake .55s ease-in-out 2}
.epj.m-blocked>img{filter:drop-shadow(0 0 6px #E5484D) saturate(.7)}
.epj.m-reduced>img{filter:saturate(.55) brightness(.95)}
@keyframes epjfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes epjslow{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(2px)}}
@keyframes epjshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-4deg)}75%{transform:translateX(5px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.epj{animation:none!important}}
.bubble{border:2px solid var(--red);color:var(--red);border-radius:18px;padding:.4rem .9rem;font-family:var(--f-head);font-weight:700;background:var(--panel)}
.path{display:flex;align-items:stretch;gap:0;margin:1.2rem 0 .4rem}
.pnode{flex:1 1 0;min-width:0;border:3px solid var(--line);border-radius:16px;padding:.7rem .5rem;text-align:center;font-weight:800;font-size:.92rem;background:var(--panel);display:flex;flex-direction:column;justify-content:center;gap:.25rem;position:relative}
.pnode em{font-style:normal;font-size:.78rem;font-weight:800}
.pnode.acc{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel));animation:pulse 1.3s ease-in-out infinite}
.pnode.acc em{color:var(--red)}
.pnode.dec{opacity:.5;border-style:dashed}
.pnode.dec em{color:var(--muted)}
.plink{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;font-size:.72rem;font-weight:800;position:relative}
.plink .ln{width:100%;height:8px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--green) 0 10px,transparent 10px 20px);background-size:20px 8px;animation:flowx 1s linear infinite}
.plink.r .ln{background-image:repeating-linear-gradient(90deg,var(--orange) 0 10px,transparent 10px 20px);animation-duration:3s;opacity:.7}
.plink.b .ln{background-image:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 16px);animation:none;opacity:.6}
.plink .x{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 0 0 4px var(--panel)}
.plink .en{color:var(--c);text-align:center;line-height:1.1}
.plink.sel .en{background:var(--c);color:#fff;padding:.1rem .4rem;border-radius:8px}
@keyframes flowx{to{background-position:20px 0}}
@keyframes flowy{to{background-position:0 20px}}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--red) 22%,transparent)}}

/* gráficas de consecuencias */
.ctl{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 .2rem}
.ctl label{font-weight:800;display:grid;gap:.2rem;flex:1;min-width:220px}
.ctl input[type=range]{width:100%;accent-color:var(--blue)}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:.9rem;margin-top:1rem}
.ch{border:2px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:16px;padding:.8rem 1rem;background:var(--panel)}
.ch h4{margin:0;font-family:var(--f-head);font-size:1.05rem}
.ch .cap{font-size:.85rem;color:var(--muted);margin:.2rem 0 .6rem;line-height:1.3}
.bars{display:flex;gap:.5rem;height:150px;position:relative;margin-top:22px;border-bottom:2px solid var(--line)}
.bw{flex:1;min-width:0;position:relative;height:100%}
.bar{position:absolute;bottom:0;left:14%;right:14%;border-radius:8px 8px 0 0;transition:height .45s cubic-bezier(.3,1.3,.5,1),background .3s}
.bv{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:800;padding-bottom:2px;white-space:nowrap}
.ref{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.55}
.bnames{display:flex;gap:.5rem;margin-top:.3rem}
.bnames span{flex:1;min-width:0;text-align:center;font-size:.68rem;font-weight:800;line-height:1.1;word-break:break-word}
.stk{display:flex;height:46px;border-radius:12px;overflow:hidden;border:2px solid var(--line);margin:.4rem 0}
.stk div{display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;overflow:hidden;transition:width .45s ease}
.leg{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;font-weight:800}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.3rem}
.lc{width:100%;height:auto}
.lc text{fill:var(--muted);font-size:9px;font-weight:700}
.hrs{display:grid;gap:.2rem;font-weight:800;font-size:.85rem;margin-top:.3rem}
.hrs input{width:100%;accent-color:var(--yellow-d)}
.anim .bar{animation:growy .9s ease both}
.anim .stk div{animation:growx .9s ease both}
.anim .dl{stroke-dasharray:1;animation:dash 1.6s ease both}
.pop{animation:popin .5s ease both}
@keyframes growy{from{height:0}}
@keyframes growx{from{width:0}}
@keyframes dash{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes popin{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.anim .bar,.anim .stk div,.anim .dl,.pop{animation:none}.bar,.stk div{transition:none}}
.cons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem;margin-top:1rem}
.crow{display:flex;gap:.8rem;align-items:flex-start;padding:.8rem 1rem;border-radius:16px;background:color-mix(in srgb,var(--red) 8%,var(--panel));border:2px solid color-mix(in srgb,var(--red) 20%,var(--line))}
.crow .ci{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 20%,var(--panel));display:grid;place-items:center;flex:none;font-size:1.1rem}
.crow b{display:block}
.clin{margin-top:1rem;border-radius:16px;padding:1rem 1.2rem;background:color-mix(in srgb,var(--yellow) 22%,var(--panel));border:2px solid var(--yellow)}
.opts{display:grid;gap:.6rem;margin:1rem 0}
.opt{display:flex;align-items:center;gap:.8rem;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:.8rem 1rem;font-weight:700;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.8rem}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.good .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:color-mix(in srgb,var(--red) 14%,var(--panel));border-color:var(--red)}
.opt.bad .dot{background:var(--red);border-color:var(--red);color:#fff}
.fb{display:flex;gap:1rem;align-items:center;border-radius:16px;padding:1rem;background:color-mix(in srgb,var(--blue) 10%,var(--panel));border:2px solid color-mix(in srgb,var(--blue) 30%,var(--line))}
.fb svg{width:84px;height:84px;flex:none}
.fb h3{margin-bottom:.2rem}
.fb p{margin:0}
.progress{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:.4rem 0 1rem}
.progress i{display:block;height:100%;background:var(--yellow)}

/* caso clínico */
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:.4rem 1rem;font-weight:800}
.eprow{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;margin:.2rem 0 1rem}
.eprow .epj{width:68px;height:68px}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.case{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.2rem}
.story{display:flex;gap:1rem;align-items:center}
.story svg{width:150px;height:auto;flex:none}
.story .kidimg{width:120px;height:auto;flex:none;border-radius:14px;background:#fff;padding:6px;box-sizing:border-box}
.clues{display:grid;gap:.5rem}
.clue{border:2px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.clue>button{width:100%;display:flex;align-items:center;gap:.6rem;background:none;border:0;padding:.7rem 1rem;font-weight:800;text-align:left}
.clue>button svg{width:20px;height:20px;flex:none;color:var(--purple)}
.clue p{margin:0;padding:0 1rem .9rem 2.9rem}
.clue.open{border-color:var(--purple)}
.theory{display:inline-block;background:color-mix(in srgb,var(--orange) 25%,var(--panel));padding:.1rem .6rem;border-radius:8px;font-weight:800;font-size:.85rem;margin-bottom:.6rem}

/* resultado quiz */
.score{text-align:center;padding:2rem 1rem}
.score .big{font-family:var(--f-head);font-size:4rem;font-weight:800;color:var(--yellow-d)}

/* glosario */
.search{width:100%;max-width:420px;padding:.7rem 1rem;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit;margin-bottom:1rem}
.gl{display:grid;gap:.7rem}
.gl dt{font-weight:800;font-family:var(--f-head);font-size:1.15rem}
.gl dd{margin:0 0 .3rem;color:var(--muted)}
.gl div{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.7rem 1rem}

/* ---------- Modo celular ---------- */
html[data-mode="mobile"] .home{grid-template-columns:1fr;padding:2rem 1.2rem;text-align:center;gap:1rem}
html[data-mode="mobile"] .home-main{order:1}
html[data-mode="mobile"] .home-art{min-height:300px;height:300px;order:2;margin:0 -1.2rem;overflow:hidden;align-self:auto}
html[data-mode="mobile"] .home-art .mitoB{left:-110px;width:auto;height:360px;max-width:none}
html[data-mode="mobile"] .home-art .prof{left:auto;right:12%;width:170px}
html[data-mode="mobile"] .home-list{order:3}
html[data-mode="mobile"] .s1, html[data-mode="mobile"] .s3{display:none}
html[data-mode="mobile"] .app{grid-template-columns:1fr}
html[data-mode="mobile"] .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;padding:.5rem .7rem;gap:.6rem;overflow-x:auto}
html[data-mode="mobile"] .brand{font-size:1.4rem;flex:none}
html[data-mode="mobile"] .nav{display:flex;gap:.3rem}
html[data-mode="mobile"] .nav button{padding:.5rem .7rem;white-space:nowrap;font-size:.9rem}
html[data-mode="mobile"] .cycle, html[data-mode="mobile"] .rx, html[data-mode="mobile"] .case{grid-template-columns:1fr}
html[data-mode="mobile"] .path{flex-direction:column}
html[data-mode="mobile"] .plink{flex:0 0 58px;flex-direction:row;gap:.6rem}
html[data-mode="mobile"] .plink .ln{width:8px;height:100%;min-height:36px;background-image:repeating-linear-gradient(180deg,var(--green) 0 10px,transparent 10px 20px);animation-name:flowy;max-width:8px}
html[data-mode="mobile"] .plink.r .ln{background-image:repeating-linear-gradient(180deg,var(--orange) 0 10px,transparent 10px 20px)}
html[data-mode="mobile"] .plink.b .ln{background-image:repeating-linear-gradient(180deg,var(--red) 0 8px,transparent 8px 16px)}
html[data-mode="mobile"] .plink .x{transform:translate(-50%,-50%)}
html[data-mode="mobile"] .story{flex-direction:column;align-items:flex-start}

/* Ajustes propios del modo celular */
html[data-mode="mobile"] .logo{font-size:clamp(2.8rem,13vw,3.8rem)}
html[data-mode="mobile"] .main{padding:1.1rem 1rem 5.5rem}
html[data-mode="mobile"] .main h1{font-size:1.6rem}
html[data-mode="mobile"] .btn{min-height:46px}
html[data-mode="mobile"] .btn-big{font-size:1.3rem;padding:.7rem 2rem}
html[data-mode="mobile"] .opt,html[data-mode="mobile"] .stepbtn{padding:.9rem 1rem}
html[data-mode="mobile"] .menu-grid{grid-template-columns:1fr 1fr;gap:.8rem}
html[data-mode="mobile"] .mcard{min-height:170px;padding:1rem .6rem;border-radius:20px}
html[data-mode="mobile"] .mcard .ic{width:62px;height:62px;border-radius:18px}
html[data-mode="mobile"] .mcard .ic svg{width:36px;height:36px}
html[data-mode="mobile"] .mcard h3{font-size:1.05rem}
html[data-mode="mobile"] .mcard p{font-size:.85rem}
html[data-mode="mobile"] .mcard .go{display:none}
html[data-mode="mobile"] .card{padding:1rem}
@media (min-width:861px){
  /* Vista previa del modo celular en una pantalla grande */
  html[data-mode="mobile"]{background:#16302C}
  html[data-mode="mobile"] body{max-width:390px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.5)}
}
/* Lienzo fijo de 390 px: todo mide igual en cualquier celular (se escala con zoom) */
html[data-mode="mobile"]{zoom:var(--zf,1)}
html[data-canvas="1"]{--vw:3.9px;--vh:8.44px}
@media (max-width:860px){
  html[data-canvas="1"]{background:var(--bg)}
  html[data-canvas="1"]:has(.lh){background:#C3E8FB}
  html[data-canvas="1"]:has(.home){background:#0A1330}
}
html[data-canvas="1"] #lb-intro{width:calc(100vw / var(--zf,1));height:calc(100dvh / var(--zf,1))}
/* El personaje y el icono de cada tarjeta ocupan el mismo espacio reservado: no hay saltos al cargar */
.mcard{grid-template-rows:130px}
html[data-mode="mobile"] .mcard{grid-template-rows:92px}
.mcard .ic,.mcard .pj{align-self:center}
/* Ajustes propios del modo computadora */
html[data-mode="desktop"] .main{padding:2.4rem clamp(1.5rem,calc(4*var(--vw)),3.4rem) 4rem}
html[data-mode="desktop"] .menu-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

/* ---------- Bibliografía ---------- */
.bib{list-style:none;margin:0;padding:0;display:grid;gap:.8rem;counter-reset:b}
.bib li{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem .8rem 3.4rem;position:relative;counter-increment:b;overflow-wrap:anywhere}
.bib li::before{content:counter(b);position:absolute;left:.9rem;top:.75rem;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#2A1D00;display:grid;place-items:center;font-family:var(--f-head);font-weight:800}
.bib a{color:var(--blue)}

/* ---------- Controles de sonido y pantalla ---------- */
#lb-dock{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:150;display:flex;gap:.4rem;align-items:center}
#lb-dock button{height:42px;min-width:42px;padding:0 .7rem;border-radius:999px;border:2px solid rgba(255,255,255,.28);background:rgba(14,26,58,.88);color:#fff;font:800 .82rem var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;position:relative;box-shadow:0 4px 14px rgba(5,10,30,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#lb-dock button:hover{background:rgba(23,40,79,.95)}
#lb-dock button .ei{font-size:1.1rem;line-height:1}
#lb-dock button[aria-pressed="false"]{opacity:.65}
#lb-dock button[aria-pressed="false"] .ei::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:3px;border-radius:2px;background:var(--yellow);transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 0 1px #0E1A3A}
html[data-mode="mobile"] #lb-dock button{height:38px;min-width:38px}


/* ---------- Pantalla inicial: ¿cuál es tu dispositivo? ---------- */
#lb-device{position:fixed;inset:0;z-index:600;background:radial-gradient(900px 560px at 26% 58%,#2F6A5E 0,#1F4A42 46%,#12302B 100%);color:#fff;display:grid;place-items:center;padding:1.2rem;overflow:auto;transition:opacity .4s}
#lb-device.out{opacity:0;pointer-events:none}
#lb-device .dv-in{display:flex;align-items:center;justify-content:center;gap:clamp(1rem,calc(4*var(--vw)),3.5rem);flex-wrap:wrap;max-width:1000px;width:100%}
#lb-device .dv-pj{height:clamp(150px,calc(50*var(--vh)),460px);max-width:min(calc(80*var(--vw)),380px);object-fit:contain;animation:dvbob 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.4))}
#lb-device .dv-q{text-align:center;flex:1 1 320px;max-width:520px}
#lb-device h2{font-size:clamp(1.6rem,calc(4.6*var(--vw)),2.6rem);margin:0 0 .3rem}
#lb-device p{color:#9FB2EC;margin:0 0 1.4rem}
.dv-btns{display:flex;gap:1rem;justify-content:center}
.dv-b{width:clamp(125px,calc(38*var(--vw)),200px);aspect-ratio:1;border:0;border-radius:26px;color:#fff;display:grid;place-content:center;justify-items:center;gap:.6rem;font:800 clamp(1.05rem,calc(3.6*var(--vw)),1.35rem) var(--f-head);box-shadow:0 6px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.35);animation:dvfloat 2.6s ease-in-out infinite}
.dv-b svg{width:56%;height:auto}
.dv-m{background:var(--blue)}
.dv-c{background:var(--purple);animation-delay:-1.3s}
.dv-b:hover{filter:brightness(1.12)}
@keyframes dvfloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-9px) rotate(1.2deg)}}
@keyframes dvbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Aviso para girar el celular en modo computadora */
#lb-rot{display:none;position:fixed;inset:0;z-index:400;background:#0A1330;color:#fff;place-items:center;text-align:center;padding:2rem}
html[data-rot="1"] #lb-rot{display:grid}
#lb-rot svg{width:90px;height:90px;margin:0 auto 1rem;animation:rotphone 2.2s ease-in-out infinite}
#lb-rot h2{font-size:1.6rem;margin-bottom:.4rem}
#lb-rot p{color:#9FB2EC;margin:0 0 1.2rem}
#lb-rot button{border:0;border-radius:999px;padding:.7rem 1.4rem;font:800 1rem var(--f-body);background:var(--yellow);color:#2A1D00;box-shadow:0 4px 0 var(--yellow-d)}
@keyframes rotphone{0%,25%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}

/* Personajes del inicio y del menú */
.home-art img.prof{width:clamp(170px,62%,300px);height:auto;max-height:92%;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(0,0,0,.4))}
.mcard .pj{height:130px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
html[data-mode="mobile"] .mcard .pj{height:92px}

/* Mitocondria animada (Ciclo de β-oxidación) */
.mito .mbody{transform-box:fill-box;transform-origin:center;animation:mbreath 4s ease-in-out infinite}
.mito .mcr{animation:mcr 3s ease-in-out infinite}
.mito .mflow{animation:mflow 1.2s linear infinite}
.mito .mring{fill:none;stroke:#fff;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:mring 8s ease-out infinite;pointer-events:none}
.mito .mtok{opacity:0;animation:mtok 8s linear infinite;pointer-events:none}
.mito .mtok .ch{opacity:0}
.mito .mtok .chA{animation:mchA 8s linear infinite}
.mito .mtok .chB{animation:mchB 8s linear infinite}
.mito .mtok .chC{animation:mchC 8s linear infinite}
.mito .mace{opacity:0;animation:mace 8s linear infinite;pointer-events:none}
.mito .mbub{opacity:0;animation:mbub 5s ease-in infinite;pointer-events:none}
@keyframes mbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes mcr{0%,100%{opacity:.6;stroke-width:9}50%{opacity:.95;stroke-width:11.5}}
@keyframes mflow{to{stroke-dashoffset:-11}}
@keyframes mring{0%{opacity:.9;transform:scale(1)}14%{opacity:0;transform:scale(2.2)}100%{opacity:0;transform:scale(2.2)}}
@keyframes mtok{0%{transform:translate(228px,72px);opacity:0}3%{opacity:1}30%{transform:translate(176px,108px)}55%{transform:translate(196px,150px)}80%{transform:translate(160px,192px);opacity:1}86%{opacity:0}100%{transform:translate(160px,192px);opacity:0}}
@keyframes mchA{0%,29%{opacity:1}30%,100%{opacity:0}}
@keyframes mchB{0%,29%{opacity:0}30%,54%{opacity:1}55%,100%{opacity:0}}
@keyframes mchC{0%,54%{opacity:0}55%,100%{opacity:1}}
@keyframes mace{0%,79%{opacity:0;transform:translate(160px,192px)}80%{opacity:1;transform:translate(160px,192px)}100%{opacity:0;transform:translate(122px,228px)}}
@keyframes mbub{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-42px)}}

/* Vista de computadora a 150 % (como la lupa del navegador) */
html[data-mode="desktop"][data-phone="0"]{zoom:1.5;--vw:calc(1vw/1.5);--vh:calc(1vh/1.5)}
html[data-mode="desktop"][data-phone="0"] .home{grid-template-columns:minmax(180px,1fr) minmax(280px,1.1fr) minmax(230px,.9fr);gap:1rem;padding:2rem 1.5rem 2rem 0}
html[data-mode="desktop"][data-phone="0"] .home-art .mitoB{left:-55%;width:150%}
html[data-mode="desktop"][data-phone="0"] .pill{font-size:.92rem}

/* Personaje de cada pestaña, arriba a la derecha */
.main{position:relative}
.tabpj{position:absolute;top:.5rem;right:clamp(1rem,calc(3*var(--vw)),2.6rem);height:130px;width:auto;max-width:200px;object-fit:contain;pointer-events:none;z-index:2;filter:drop-shadow(0 8px 10px rgba(14,26,58,.28))}
.main.hasPj>.tabpj+*{min-height:100px}
.main.hasPj>.tabpj+h1{padding-right:200px}
.main.hasPj>.tabpj+.tabs{align-items:flex-start}
html[data-mode="mobile"] .tabpj{height:92px;max-width:120px;top:.5rem;right:.8rem}
html[data-mode="mobile"] .main.hasPj>.tabpj+*{min-height:66px}
html[data-mode="mobile"] .main.hasPj>.tabpj+h1{padding-right:110px}

/* ---------- Video de inicio ---------- */
#lb-intro{position:fixed;inset:0;z-index:500;background:#000;display:grid;place-items:center;transition:opacity .4s}
#lb-intro.out{opacity:0;pointer-events:none}
#lb-intro{width:100%;height:100%;height:100dvh;overflow:hidden}
/* El video se ve completo dentro del recuadro de la pantalla (sin recortes), centrado y respetando las muescas del celular */
#lb-intro video{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;
  width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  object-fit:contain;background:#000}
/* En computadora la página se muestra a 150 %: se compensa para que el recuadro mida exactamente la ventana */
html[data-mode="desktop"][data-phone="0"] #lb-intro{width:calc(var(--vw)*100);height:calc(var(--vh)*100)}
#lb-intro button{position:absolute;border:0;border-radius:999px;font:800 1rem var(--f-body);padding:.7rem 1.3rem;color:#2A1D00;background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d)}
#lb-intro .in-skip{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
#lb-intro .in-snd{bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ====================== Temática BetaOx ====================== */
.app{grid-template-columns:250px minmax(0,1fr)}
.side{background:linear-gradient(180deg,#22504A 0,#183C38 100%);padding:1.3rem .9rem 4.4rem;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:.65rem;padding:0 .3rem;font-size:1rem}
.brand .blogo{width:52px;height:52px;flex:none}

.brand .bt small{font:600 .76rem var(--f-body);color:#C5E3D6;margin-top:.15rem;white-space:nowrap}
.nav{gap:.3rem}
.nav button{color:#DDEFE7;padding:.78rem 1rem;border-radius:14px;font-size:1.02rem}

.side-pj{width:118px;margin:auto auto 0;display:block;animation:hfloat 3.2s ease-in-out infinite}

.main{padding-top:2rem}
.mcard{color:#1D2B3A}
.mcard .ic{background:rgba(255,255,255,.65)}
.mcard .go{background:rgba(255,255,255,.7)}

/* Inicio */
.hm{container-type:inline-size;min-width:0;padding:1.1rem 1.5rem 1.8rem;background:var(--bg)}
.hm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);grid-template-areas:"hero right" "mito right" "info right";grid-template-rows:auto auto 1fr;column-gap:1.5rem;row-gap:.6rem;align-items:start}
.hm-hero{grid-area:hero;position:relative;padding:.2rem .3rem 0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1rem;align-items:start}
.hm-hero>*:not(.hm-note){grid-column:1}
.hm-mito{grid-area:mito}
.hm-info{grid-area:info}
.hm-right{grid-area:right}
.hm-hello{display:inline-block;font:800 .95rem var(--f-body);letter-spacing:.28em;text-transform:uppercase;transform:rotate(-3deg);transform-origin:left;color:var(--text)}
.hm-title{font:700 clamp(2.8rem,8.2cqw,5.8rem)/.95 var(--f-hand);margin:.15rem 0 0;transform:rotate(-2deg);transform-origin:left;color:#14212E;letter-spacing:-.5px}
:root[data-theme="dark"] .hm-title{color:#fff}
.hm-sub{font:600 clamp(1.5rem,4.4cqw,2.5rem)/1.05 var(--f-hand);margin:.25rem 0 0 .8rem;transform:rotate(-2deg);transform-origin:left;color:var(--text)}
.hm-ul{display:block;width:min(70%,380px);height:12px;margin:.1rem 0 0 .6rem}
.hm-note{grid-column:2;grid-row:1/span 4;position:relative;margin:1.2rem .4rem 0 1.4rem;max-width:13rem;font:600 clamp(1.2rem,2.6cqw,1.7rem)/1.1 var(--f-hand);transform:rotate(-7deg);color:var(--text)}
.hm-note::before{content:"";position:absolute;left:-1.3rem;top:.6rem;width:.9rem;height:.9rem;border-top:3px solid var(--text);border-radius:2px;transform:rotate(25deg);opacity:.8}
.mitoBx{display:block;width:100%;height:auto;color:var(--text)}
.mitoBx .bxt{font:800 14px Nunito,sans-serif;fill:#fff}
.mitoBx .bxl{font:800 14px Nunito,sans-serif}
.mitoBx .bxk{fill:currentColor;font-size:15px}
.bx-atp{transform-box:fill-box;transform-origin:center;animation:hpulse 2.6s ease-in-out infinite}
@keyframes hpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.hm-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;align-self:start}
.ic-card{position:relative;border-radius:20px;padding:.9rem 1rem 1rem;border:1.5px solid rgba(20,40,60,.07);color:#1D2B3A;font-size:.84rem;line-height:1.38;display:flex;flex-direction:column;gap:.5rem}
.ic-card h3{display:flex;align-items:center;gap:.5rem;font-size:1.12rem}
.ic-card h3 svg{width:26px;height:26px;color:#2B6B5A;flex:none}
.ic-card p{margin:0}
.ic-btn{margin-top:auto;align-self:flex-start;border:0;border-radius:999px;background:#2F5D62;color:#fff;font:800 .88rem var(--f-body);padding:.6rem 1.05rem;display:inline-flex;align-items:center;gap:.5rem}
.ic-btn .arrow{width:1em;height:1em}
.ic-btn:hover{background:#274D51}
.route{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.route li{display:flex;gap:.6rem;align-items:center;line-height:1.2}
.route i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 .8rem var(--f-body);font-style:normal}
.route small{display:block;color:#5B5F7A;font-size:.74rem}
.ic-go{align-self:flex-end;width:32px;height:32px;border-radius:50%;border:0;background:#8E7FC9;color:#fff;display:grid;place-items:center;margin-top:auto}
.ic-go svg{width:16px;height:16px}
.ic-hand{font:700 1.35rem/1.05 var(--f-hand);transform:rotate(-4deg);margin-top:auto!important;color:#1D4E6E}
.hm-top{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.hm-search{flex:1;position:relative;min-width:0}
.hm-search svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#7B8793;pointer-events:none}
.hm-search input{width:100%;height:46px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:#1D2B3A;font:600 1rem var(--f-body);padding:0 1rem 0 2.8rem}
.hm-search input::placeholder{color:#8A95A0}
.hm-avatar{width:42px;height:42px;border-radius:50%;background:#5FA58A;color:#fff;display:grid;place-items:center;flex:none}
.hm-avatar svg{width:24px;height:24px}
.hm-msg{margin:-.3rem 0 .6rem .4rem;min-height:0;font-size:.88rem;color:var(--muted)}
.hm-msg:empty{display:none}
.hm-card{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;border:1.5px solid rgba(20,40,60,.06);border-radius:22px;padding:.85rem 1rem;margin:0 0 .85rem;background:var(--c1);color:#1D2B3A;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 10px rgba(30,50,70,.06)}
.hm-card:hover{transform:translateX(-4px);box-shadow:0 8px 18px rgba(30,50,70,.12)}
.hm-ci{width:68px;height:68px;border-radius:50%;background:var(--c2);color:var(--c3);display:grid;place-items:center;flex:none}
.hm-ci svg{width:34px;height:34px}
.hm-ct{display:grid;gap:.1rem;min-width:0;flex:1}
.hm-ct b{font:800 1.22rem var(--f-head)}
.hm-ct small{font:600 .9rem/1.25 var(--f-body);color:#4F5D6B}
.hm-chev svg{width:22px;height:22px;color:#33414E}
@container (max-width:1099px){
  .hm-grid{grid-template-columns:minmax(0,1fr) minmax(250px,310px);grid-template-areas:"hero right" "mito right" "info info"}

  .hm-note{grid-column:1;grid-row:auto;transform:rotate(-3deg);max-width:none;margin:.5rem 0 0 .6rem}

  .hm-ci{width:56px;height:56px}.hm-ci svg{width:28px;height:28px}

}

  if(nodes){
    const P=[[228,72],[176,108],[196,150],[160,192]], T=[0,2.4,4.4,6.4];
    ng = `<path class="mflow" d="M228 72 L176 108 L196 150 L160 192" fill="none" stroke="#FFC83D" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>`;

    const chain=(pts)=>{const d='M'+pts.join(' L'); return `<path d="${d}" fill="none" stroke="#7A1F12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#FFE08A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;};

}

/* Moléculas en esqueleto: cadena de n carbonos terminada en C(=O)-S-CoA */
function mol(mod, n=6){
  const dx=24, x0=14, hi=52, lo=66;
  const pts=[];
  for(let i=0;i<n;i++) pts.push([x0+i*dx, ((n-1-i)%2===0)?lo:hi]);
  const L=pts[n-1], S=[L[0]+dx, hi];
  const all=[...pts,S].map(p=>p.join(',')).join(' ');
  let s=`<polyline points="${all}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<line x1="${L[0]-2.5}" y1="${L[1]}" x2="${L[0]-2.5}" y2="${L[1]-22}" stroke="currentColor" stroke-width="2.2"/><line x1="${L[0]+2.5}" y1="${L[1]}" x2="${L[0]+2.5}" y2="${L[1]-22}" stroke="currentColor" stroke-width="2.2"/>`;
  s+=`<text x="${L[0]}" y="${L[1]-28}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">O</text>`;
  s+=`<text x="${S[0]+4}" y="${S[1]-5}" font-size="12" font-weight="700" fill="currentColor">S-CoA</text>`;
  if(n>=3){
    const b=pts[n-3], a=pts[n-2];
    if(mod==='enoyl') s+=`<line x1="${b[0]+3}" y1="${b[1]+4}" x2="${a[0]-1}" y2="${a[1]+5}" stroke="#E5484D" stroke-width="2.2"/>`;
    if(mod==='hydroxy') s+=`<line x1="${b[0]}" y1="${b[1]}" x2="${b[0]}" y2="${b[1]+20}" stroke="#E5484D" stroke-width="2.2"/><text x="${b[0]}" y="${b[1]+34}" text-anchor="middle" font-size="12" font-weight="700" fill="#E5484D">OH</text>`;
    if(mod==='keto') s+=`<line x1="${b[0]-2.5}" y1="${b[1]}" x2="${b[0]-2.5}" y2="${b[1]+20}" stroke="#E5484D" stroke-width="2.2"/><line x1="${b[0]+2.5}" y1="${b[1]}" x2="${b[0]+2.5}" y2="${b[1]+20}" stroke="#E5484D" stroke-width="2.2"/><text x="${b[0]}" y="${b[1]+33}" text-anchor="middle" font-size="12" font-weight="700" fill="#E5484D">O</text>`;
  }
  return `<svg viewBox="0 0 210 110" role="img" aria-label="Estructura simplificada">${s}</svg>`;
}

const SEARCH_KEYS=[
  ['ciclo','proceso ciclo reaccion reacciones beta oxidacion paso pasos etapas'],
  ['bio','biobloqueo bloqueo bloquear enzima enzimas enzimatico deshidrogenasa hidratasa tiolasa'],
  ['caso','caso casos clinico clinicos paciente'],
  ['eval','evaluacion examen quiz pregunta preguntas prueba'],
  ['glos','teoria glosario concepto conceptos termino terminos definicion carnitina'],
  ['biblio','recurso recursos bibliografia fuentes referencias libros']
];
const _norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function homeSearch(){
  const inp=document.getElementById('hm-search'), msg=document.getElementById('hm-msg'); if(!inp) return;
  const q=_norm(inp.value); if(!q){ if(msg) msg.textContent=''; return; }
  const toks=q.split(/\s+/).filter(Boolean);
  for(const [v,keys] of SEARCH_KEYS){
    const ws=keys.split(' ');
    if(toks.some(t=>ws.some(w=>w.startsWith(t)||(t.length>=4&&t.startsWith(w))))){ go(v); return; }
  }
  if(msg) msg.textContent='No encontré esa sección. Prueba con teoría, proceso, bloqueo, casos o evaluación.';
}
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target&&ev.target.id==='hm-search'){ ev.preventDefault(); homeSearch(); } });
document.addEventListener('input',ev=>{ if(ev.target&&ev.target.id==='hm-search'){ const m=document.getElementById('hm-msg'); if(m) m.textContent=''; } });

function shell(active, body){
  const k=TABPJ[active];
  const pj=k?`<img class="tabpj" src="personajes/personaje${k}.png" alt="" loading="eager" decoding="sync" onerror="this.parentNode.classList.remove('hasPj');this.remove()">`:'';
  return `<div class="app">
    ${sideHTML(active,false)}
    <main class="main${k?' hasPj':''}${['glos','caso','eval','biblio'].includes(active)?' mt':''}">${pj}${body}</main>
  </div>`;
}

function vCiclo(){
  const bgc=['#D6ECFF','#D5F3D9','#E6DCFB','#FCEFC8'], nc=['#1E7BEF','#1FA55A','#8E4FD8','#F08A1C'];
  const spk=(f)=>`<svg class="cySp ${f}" viewBox="0 0 60 60" aria-hidden="true"><g stroke="#1E7BEF" stroke-width="4" stroke-linecap="round" fill="none">${f==='l'?'<path d="M6 22l14 3M10 44l12-8M30 6l4 12"/>':'<path d="M54 14l-14 6M50 40l-12-4M28 4l-2 14"/>'}</g></svg>`;
  return shell('ciclo',`<div class="cyHead">${spk('l')}<h1 class="cyT">Ciclo de β-oxidación</h1>${spk('r')}</div>
    <div class="cycle cyNew">
      <div class="cyMito"><img src="${CYIMG}" alt="Mitocondria" draggable="false">
        <div class="cyLab"><svg viewBox="0 0 40 50" aria-hidden="true"><path d="M30 46C14 44 8 30 12 12M5 20l7-9 9 6" fill="none" stroke="#1E5FC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Mitocondria</span><svg class="cyUl" viewBox="0 0 200 12" aria-hidden="true"><path d="M3 9Q100 1 197 5" fill="none" stroke="#1E7BEF" stroke-width="4" stroke-linecap="round"/></svg></div></div>
      <div class="steps">
        ${ENZ.map((e,i)=>`<button class="stepbtn cySt" style="--b:${bgc[i]};--n:${nc[i]}" data-a="rx" data-n="${e.id}"><span class="num">${e.id}</span><span class="cyTx">${e.step}</span><span class="cyMs">${enzChar(e.id)}</span></button>`).join('')}
        <div class="hint cyHint"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#1E7BEF" stroke-width="3" stroke-linecap="round"><path d="M14 8l4 6M26 4v8M38 8l-4 6"/></g><path d="M26 20c0-4 8-4 8 0v14l4-1c3-1 6 1 5 4l-1 12c-1 6-5 9-10 9h-6c-4 0-7-3-9-6L12 40c-2-3 2-6 5-4l9 7z" fill="#fff" stroke="#14285A" stroke-width="3" stroke-linejoin="round"/></svg><span>Haz clic en cada paso para ver la reacción en detalle</span></div>
      </div>
    </div>
    <p class="foot">En cada vuelta del ciclo, la cadena del ácido graso se acorta en dos carbonos. El ciclo se repite hasta convertir todo el ácido graso en acetil-CoA.</p>`);
}

function vRx(){
  const e=ENZ[S.n-1], n=S.n;
  const mods=[['acyl','enoyl'],['enoyl','hydroxy'],['hydroxy','keto']];
  let left, right;
  if(n<4){ left=mol(mods[n-1][0]); right=mol(mods[n-1][1]); }
  else { left=mol('keto'); right=`<div class="mol-pair">${mol('acyl',4)}${mol('acyl',2)}</div>`; }
  const cof = n===1?'FAD → FADH₂':n===2?'+ H₂O':n===3?'NAD⁺ → NADH + H⁺':'+ CoA-SH';
  const caps=[[e.sub,e.prod]][0];
  return shell('ciclo',`<div class="tabs" style="--c:${e.color}">${ENZ.map((x,i)=>`${i?'<i></i>':''}<button style="--c:${x.color}" data-a="rx" data-n="${x.id}" ${x.id===n?'aria-current="step"':''} aria-label="Reacción ${x.id}">${x.id}</button>`).join('')}</div>
    <div class="rx">
      <div class="card">
        <h1 style="margin-bottom:.2rem;color:${e.color}">${e.step}</h1>
        <p class="note" style="margin:0">${e.name}</p>
        <div class="rx-eq">
          <figure class="mol" style="margin:0">${left}<figcaption>${caps[0]}</figcaption></figure>
          <div class="rarrow"><small>${e.name}</small>${arrowSVG}${cof}</div>
          <figure class="mol" style="margin:0">${right}<figcaption>${caps[1]}</figcaption></figure>
        </div>
        <p class="note" style="margin:0">En rojo se marca el grupo que cambia en esta reacción. La cadena se dibuja con 6 carbonos como ejemplo.</p>
      </div>
      <div class="card"><h3 style="margin-bottom:.6rem">¿Qué ocurre?</h3>
        <div class="say"><div style="width:96px;flex:none">${enzChar(e.id)}</div><p>${e.expl}</p></div>
        <button class="btn btn-p" style="margin-top:1rem" data-a="blk" data-n="${n}">${ico('lock','width="18" height="18"')}Probar el bloqueo</button>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-g circ" data-a="rx" data-n="${Math.max(1,n-1)}" aria-label="Reacción anterior" ${n===1?'disabled':''}>${ico('back','width="20" height="20"')}</button>
      ${n<4?`<button class="btn btn-b" data-a="rx" data-n="${n+1}">Siguiente ${ico('arrow','class="arrow"')}</button>`:`<button class="btn btn-y" data-a="blk" data-n="4">Bloquear una enzima ${ico('arrow','class="arrow"')}</button>`}
    </div>`);
}

function pathHTML(e){
  const k=e.id, st=S.bio.state;
  const nodes=['Acil-CoA','Enoil-CoA','3-Hidroxiacil-CoA','3-Cetoacil-CoA','Acetil-CoA + acil-CoA (n−2)'];
  let h='';
  nodes.forEach((t,i)=>{
    let cls='', tag='';
    if(st==='bloqueada'){ if(i===k-1){cls='acc';tag='se acumula';} else if(i>=k){cls='dec';tag='disminuye';} }
    if(st==='reducida'){ if(i===k-1){cls='acc';tag='se acumula algo';} else if(i>=k){cls='dec';tag='disminuye algo';} }
    h+=`<div class="pnode ${cls}">${t}${tag?`<em>${tag}</em>`:''}</div>`;
    if(i<4){
      const en=ENZ[i], sel=(i+1===k);
      const lc = st==='bloqueada'&&sel?'b':st==='reducida'&&sel?'r':st==='bloqueada'&&i+1>k?'b':'';
      const blocked = st==='bloqueada'&&sel;
      h+=`<div class="plink ${lc} ${sel?'sel':''}" style="--c:${en.color}"><span class="en">E${i+1}</span><div class="ln"></div>${blocked?'<span class="x" aria-label="Bloqueado">✕</span>':''}</div>`;
    }
  });
  return `<div class="path" role="img" aria-label="Ruta de la β-oxidación">${h}</div>`;
}

/* ---- gráficas de consecuencias ---- */
const BN1=['Acil-CoA','Enoil-CoA','Hidroxiacil-CoA','Cetoacil-CoA'], BN2=['FADH₂','NADH','Acetil-CoA','Cuerpos cetónicos'];
const fatE=t=>20+75*(1-Math.exp(-t/6));
function consVals(){
  const k=S.bio.enz, a=S.bio.act/100;
  const inter=[0,1,2,3].map(i=> i<k-1?100 : i===k-1?100+(1-a)*250 : 100*a);
  const prod=[k===1?100*a:100, k<=3?100*a:100, 100*a, 100*a];
  const y=(k===1?14*a : k===4?4+10*a : 1.5+12.5*a)/14;
  return {inter,prod,y,a};
}
const barCol=v=>v>115?'var(--red)':v<85?'var(--purple)':'var(--green)';
const pathD=f=>{let d='';for(let t=0;t<=24;t++)d+=(t?'L':'M')+(30+t*260/24).toFixed(1)+' '+(140-f(t)*1.2).toFixed(1);return d;};
function barsHTML(arr,max,names,pre){
  return `<div class="bars"><i class="ref" style="bottom:${100/max*100}%"></i>${arr.map((v,i)=>`<div class="bw"><div class="bar" data-k="${pre}${i}" style="height:${Math.min(v/max*100,100)}%;background:${barCol(v)}"><span class="bv">${Math.round(v)}%</span></div></div>`).join('')}</div><div class="bnames">${names.map(n=>`<span>${n}</span>`).join('')}</div>`;
}
function chartsHTML(e){
  const v=consVals(), h=S.bio.hrs, x=30+h*260/24, A=Math.round(v.a*100);
  return `<div class="ctl"><label>Actividad de la enzima: <span id="v-act">${S.bio.act}%</span>
      <input type="range" id="sl-act" min="0" max="100" step="5" value="${S.bio.act}" aria-label="Actividad de la enzima"></label></div>
    <p class="note" style="margin:0">Arrastra el deslizador y mira cómo se mueven las gráficas. La línea punteada es el nivel normal (100%).</p>
    <div class="chs ${S.bio.showQ?'':'anim'}">
      <div class="ch" style="--c:#E5484D"><h4>📈 Acumulación de sustrato</h4><p class="cap">${e.accum}</p>${barsHTML(v.inter,350,BN1,'i')}</div>
      <div class="ch" style="--c:#8B5CF6"><h4>📉 Disminución de productos</h4><p class="cap">${e.decr}</p>${barsHTML(v.prod,100,BN2,'p')}</div>
      <div class="ch" style="--c:#F59E0B"><h4>🔀 Alteración del flujo metabólico</h4><p class="cap">${e.flow}</p>
        <div class="stk"><div id="st-a" style="width:${A}%;background:var(--green)">${A}%</div><div id="st-b" style="width:${100-A}%;background:var(--red)">${100-A}%</div></div>
        <div class="leg"><span><i style="background:var(--green)"></i>Llega a acetil-CoA</span><span><i style="background:var(--red)"></i>Se acumula o se desvía</span></div></div>
      <div class="ch" style="--c:#FFC83D"><h4>⚡ Menor producción de energía</h4><p class="cap">${e.energy}</p>
        <svg viewBox="0 0 300 165" class="lc" role="img" aria-label="Energía obtenida de las grasas durante el ayuno">
          <line x1="30" y1="20" x2="30" y2="140" stroke="var(--line)"/><line x1="30" y1="140" x2="290" y2="140" stroke="var(--line)"/>
          <path d="${pathD(fatE)}" pathLength="1" class="dl" fill="none" stroke="var(--green)" stroke-width="3"/>
          <path id="ln-a" d="${pathD(t=>fatE(t)*v.y)}" pathLength="1" class="dl" fill="none" stroke="var(--red)" stroke-width="3"/>
          <line id="mk" x1="${x}" y1="20" x2="${x}" y2="140" stroke="var(--yellow-d)" stroke-dasharray="4 4"/>
          <circle id="mk-n" cx="${x}" cy="${140-fatE(h)*1.2}" r="5" fill="var(--green)"/><circle id="mk-a" cx="${x}" cy="${140-fatE(h)*v.y*1.2}" r="5" fill="var(--red)"/>
          <text x="30" y="154" text-anchor="middle">0 h</text><text x="160" y="154" text-anchor="middle">12 h</text><text x="290" y="154" text-anchor="middle">24 h</text>
          <text x="26" y="24" text-anchor="end">100%</text><text x="26" y="143" text-anchor="end">0</text>
          <text x="160" y="164" text-anchor="middle">Horas de ayuno</text></svg>
        <div class="leg"><span><i style="background:var(--green)"></i>Normal</span><span><i style="background:var(--red)"></i>Enzima afectada</span></div>
        <label class="hrs">Ayuno: <span id="v-hrs">${h} h</span><input type="range" id="sl-hrs" min="0" max="24" step="1" value="${h}" aria-label="Horas de ayuno"></label>
        <p class="cap" id="en-txt" style="margin:.3rem 0 0">${enTxt(v)}</p></div>
    </div>`;
}
function enTxt(v){const h=S.bio.hrs;return `A las ${h} h, la energía que aportan las grasas es ${Math.round(fatE(h))}% de lo normal en un cuerpo sano, y ${Math.round(fatE(h)*v.y)}% con la enzima afectada.`;}
function updCons(){
  const v=consVals(), r=document.getElementById('root'), q=id=>document.getElementById(id), h=S.bio.hrs, x=30+h*260/24;
  const set=(k,val,max)=>{const el=r.querySelector(`[data-k="${k}"]`);if(!el)return;el.style.height=Math.min(val/max*100,100)+'%';el.style.background=barCol(val);el.firstChild.textContent=Math.round(val)+'%';};
  v.inter.forEach((a,i)=>set('i'+i,a,350)); v.prod.forEach((a,i)=>set('p'+i,a,100));
  const A=Math.round(v.a*100);
  q('v-act').textContent=S.bio.act+'%'; q('v-hrs').textContent=h+' h';
  q('st-a').style.width=A+'%'; q('st-a').textContent=A+'%'; q('st-b').style.width=(100-A)+'%'; q('st-b').textContent=(100-A)+'%';
  q('ln-a').setAttribute('d',pathD(t=>fatE(t)*v.y));
  q('mk').setAttribute('x1',x); q('mk').setAttribute('x2',x);
  q('mk-n').setAttribute('cx',x); q('mk-n').setAttribute('cy',140-fatE(h)*1.2);
  q('mk-a').setAttribute('cx',x); q('mk-a').setAttribute('cy',140-fatE(h)*v.y*1.2);
  q('en-txt').textContent=enTxt(v);
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='sl-act'){S.bio.act=+t.value;updCons();}

    <div class="egrid">${ENZ.map(x=>`<button class="ebtn" style="--c:${x.color}" aria-pressed="${x.id===b.enz}" data-a="enz" data-n="${x.id}">${enzChar(x.id)}${x.name}</button>`).join('')}</div>

  if(st!=='normal'){

const cOk=cs=>cs.ok!==undefined?cs.ok:cs.enz-1;   // índice de la opción correcta (0 a 4)
const cLabels=cs=>ENZ.map(x=>x.id+'. '+x.name).concat(cs.extra?[(ENZ.length+1)+'. '+cs.extra]:[]);
function vCaso(){
  const c=S.cs, cs=CASES[c.i], e=ENZ[cs.enz-1];
  const cl=[['Síntomas','steth'],['Laboratorio','flask'],['Diagnóstico','dx'],['Tratamiento','rx']];
  let body=`<h1>Caso clínico</h1>
    <div class="chips">${CASES.map((x,i)=>`<button class="chip" aria-pressed="${i===c.i}" data-a="cs" data-i="${i}">${x.tab||('E'+x.enz+': '+x.title)}</button>`).join('')}</div>
    <div class="case">
      <div class="card">${cs.theory?'<span class="theory">Caso teórico</span>':''}
        <div class="story">${kid()}<p style="margin:0;font-weight:700;font-size:1.05rem">${cs.story}</p></div>
        <div style="margin-top:1rem"><button class="btn btn-p" data-a="solve">Resolver caso ${ico('arrow','class="arrow"')}</button></div>
      </div>
      <div class="card"><h3 style="margin-bottom:.7rem">Pistas clave</h3>
        <div class="clues">${cl.map(([k,ic])=>`<div class="clue ${c.open[k]?'open':''}"><button data-a="clue" data-k="${k}" aria-expanded="${!!c.open[k]}">${ico(ic)}${k}</button>${c.open[k]?`<p>${cs.clues[k]}</p>`:''}</div>`).join('')}</div>
      </div>
    </div>`;
  if(c.solve){
    const done=c.ans!==null, right=done&&c.ans===cOk(cs), ok=cOk(cs), labs=cLabels(cs);
    const fbMsg=done&&cs.fb&&cs.fb[c.ans]?cs.fb[c.ans]:'';
    body+=`<div class="card" style="margin-top:1rem"><h3>¿Qué enzima del ciclo está comprometida?</h3>
      <div class="opts">${labs.map((lb,i)=>`<button class="opt ${done?(i===ok?'good':i===c.ans?'bad':''):''}" data-a="cans" data-i="${i}" ${done?'disabled':''}><span class="dot">${done&&i===ok?'✓':done&&i===c.ans?'✕':''}</span>${String.fromCharCode(65+i)}. ${lb}${i<4?`<span style="margin-left:auto;flex:none">${enzChar(i+1)}</span>`:''}</button>`).join('')}</div>
      ${done?`<div class="fb">${enzChar(e.id,right?'ok':'reduced')}<div>${cs.extra?`<h3>${right?labs[ok]:(fbMsg?'Casi':'No es esa')}</h3>${fbMsg?`<p>${fbMsg}</p>`:''}<p>${cs.why}</p>`:`<h3>${right?'¡Correcto!':'No es esa'}: ${e.name}</h3><p>${cs.why}</p>`}</div></div>
      <div class="nav-row"><button class="btn btn-g" data-a="blk" data-n="${cs.enz}">${cs.extra?'Ver la tiolasa del paso 4 (comparación)':'Ver el bloqueo de esta enzima'}</button>${c.i<3?`<button class="btn btn-y" data-a="cs" data-i="${c.i+1}">Siguiente caso ${ico('arrow','class="arrow"')}</button>`:`<button class="btn btn-y" data-a="go" data-v="eval">Ir a la evaluación ${ico('arrow','class="arrow"')}</button>`}</div>`:''}
    </div>`;
  }
  return shell('caso',body);
}

function vEval(){
  const v=S.ev;
  if(v.done){
    const pct=v.score/QUIZ.length;
    return shell('eval',`<h1>Evaluación</h1><div class="card score"><div class="eprow">${ENZ.map(x=>enzChar(x.id)).join('')}</div><div class="big">${v.score} / ${QUIZ.length}</div>
      <p style="font-weight:700;font-size:1.1rem">${pct===1?'¡Dominas la β-oxidación!':pct>=.6?'Buen resultado. Repasa el ciclo y los bloqueos para afinarlo.':'Vuelve al ciclo y a los bloqueos antes de intentarlo otra vez.'}</p>
      <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap"><button class="btn btn-y" data-a="evreset">Intentar de nuevo</button><button class="btn btn-g" data-a="go" data-v="ciclo">Repasar el ciclo</button></div></div>`);

      <div class="opts">${q.o.map((t,i)=>`<button class="opt ${done?(i===q.a?'good':i===v.ans?'bad':''):''}" data-a="qa" data-i="${i}" ${done?'disabled':''}><span class="dot">${done&&i===q.a?'✓':done&&i===v.ans?'✕':''}</span>${String.fromCharCode(65+i)}. ${t}</button>`).join('')}</div>
      ${done?`<div class="fb">${enzChar(QZE[v.i],v.ans===q.a?'ok':'reduced')}<div><h3>${v.ans===q.a?'¡Correcto!':'Casi'}</h3><p>${q.e}</p></div></div>
      <div style="text-align:right;margin-top:1rem"><button class="btn btn-b" data-a="qnext">${v.i<QUIZ.length-1?'Siguiente':'Ver resultado'} ${ico('arrow','class="arrow"')}</button></div>`:''}
    </div>`);
}

const A={
  go:d=>go(d.v),
  rx:d=>go('rx',{n:+d.n}),

const MEDIA={

/* ---------- Efectos de sonido (se generan solos, no necesitan archivos) ---------- */
let ctx=null;
function ac(){
  if(!ctx){const C=window.AudioContext||window.webkitAudioContext; if(C) ctx=new C();}
  if(ctx&&ctx.state==='suspended') ctx.resume();
  return ctx;
}
function tone(f,t,d,type,v,to){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), s=c.currentTime+t;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,s);

  g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(v||.15,s+.012); g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g); g.connect(c.destination); o.start(s); o.stop(s+d+.03);
}

/* ---------- Video de inicio ---------- */
function intro(keepFs){
  const mobile=document.documentElement.dataset.mode==='mobile';
  /* Pantalla completa real (dentro del toque del usuario) */
  const de=document.documentElement; let enteredFs=false;
  const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  try{
    const rf=de.requestFullscreen||de.webkitRequestFullscreen;
    if(rf&&!isFs()){ const pr=rf.call(de); enteredFs=true; if(pr&&pr.catch) pr.catch(()=>{enteredFs=false;}); }
  }catch(e){}
  function leaveFs(){
    if(keepFs||!enteredFs||!isFs()) return;
    try{ const ef=document.exitFullscreen||document.webkitExitFullscreen; const r=ef&&ef.call(document); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
  }
  function fitOrientation(vw,vh){ // en celular gira la pantalla para que el video llene (vertical u horizontal)
    try{
      if(!window.lbPhone||!screen.orientation||!screen.orientation.lock||!isFs()) return;
      screen.orientation.lock(vw>=vh?'landscape':'portrait').catch(()=>{});
    }catch(e){}
  }
  function restoreOrientation(){
    try{
      if(!window.lbPhone||!screen.orientation) return;
      if(document.documentElement.dataset.mode==='desktop'&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
      else if(screen.orientation.unlock) screen.orientation.unlock();
    }catch(e){}
  }
  const first=mobile?MEDIA.videoMovil:MEDIA.videoPC, other=mobile?MEDIA.videoPC:MEDIA.videoMovil;
  const list=[first]; if(other&&other!==first) list.push(other);
  if(!first){ introOn=false; startMusic(); return; }
  introOn=true;
  const box=document.createElement('div');
  box.id='lb-intro'; box.setAttribute('role','dialog'); box.setAttribute('aria-label','Video de introducción');
  box.innerHTML='<video playsinline preload="auto"></video><button type="button" class="in-skip">Saltar ›</button><button type="button" class="in-snd" hidden>🔊 Activar sonido</button>';
  document.body.appendChild(box);
  const v=box.querySelector('video'), skip=box.querySelector('.in-skip'), snd=box.querySelector('.in-snd');
  let idx=0, closed=false;
  function close(){
    if(closed) return; closed=true;
    document.removeEventListener('keydown',esc,true);
    v.pause(); box.classList.add('out'); setTimeout(()=>box.remove(),450);
    restoreOrientation(); leaveFs();
    introOn=false; startMusic();
  }
  function esc(e){ if(e.key==='Escape') close(); }
  function play(){
    v.muted=false;
    const p=v.play();
    if(p&&p.catch) p.catch(err=>{
      if(err&&err.name!=='NotAllowedError') return;      // un archivo que falta lo maneja el evento "error"
      v.muted=true; snd.hidden=false;                    // sin permiso para sonido: inicia en silencio
      const q=v.play(); if(q&&q.catch) q.catch(()=>{ if(!closed&&v.error==null) close(); });
    });
  }
  function load(){ v.src=list[idx]; v.load(); play(); }
  v.addEventListener('loadedmetadata',()=>{ if(v.videoWidth&&v.videoHeight) fitOrientation(v.videoWidth,v.videoHeight); });
  v.addEventListener('ended',close);
  v.addEventListener('error',()=>{ idx++; if(idx<list.length) load(); else close(); }); // si no hay video, la app sigue normal
  snd.addEventListener('click',()=>{ v.muted=false; snd.hidden=true; });
  skip.addEventListener('click',close);
  document.addEventListener('keydown',esc,true);
  load(); skip.focus({preventScroll:true});
}

    '<button type="button" class="dv-b dv-m" data-d="mobile"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="38" r="2" fill="currentColor"/></svg><span>Celular</span></button>'+
    '<button type="button" class="dv-b dv-c" data-d="desktop"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="7" width="40" height="27" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><path d="M17 43h14M24 34v9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Computadora</span></button>'+

function readData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function prep(f){
  const raw=await readData(f);
  if(!/^image\/(png|jpeg|webp)$/.test(f.type))return {src:raw,ar:(await loadImg(raw).then(i=>i.naturalHeight/i.naturalWidth).catch(()=>1))};
  const im=await loadImg(raw);const M=1400,m=Math.max(im.naturalWidth,im.naturalHeight);
  if(m<=M)return {src:raw,ar:im.naturalHeight/im.naturalWidth};
  const k=M/m,c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return {src:c.toDataURL(f.type==='image/png'?'image/png':f.type,.92),ar:c.height/c.width};
}
async function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length){status('Ese archivo no es una imagen.');return;}
  let n=0;
  for(const f of list){
    try{
      const {src,ar}=await prep(f);
      const mob=dev()==='mobile', w=mob?40:22, lw=layer.offsetWidth||innerWidth, lh=mob?844*(lw/390):(layer.offsetHeight||innerHeight), k=mob?(layer.getBoundingClientRect().width/(lw||1)):1;
      const hp=(w/100*lw*ar)/lh*100, yc=(scrollY+innerHeight/2)/k/lh*100;
      const z=st.imgs.reduce((m,i)=>Math.max(m,i.z),0)+1;
      const it={id:uid(),view:keyOf(),dev:dev(),src,name:f.name.replace(/\.[^.]+$/,'')||'imagen',ar,x:Math.round((50-w/2+n*3)*10)/10,y:Math.round(Math.max(0,yc-hp/2+n*3)*10)/10,w,rot:0,flip:false,z,d:-Math.round(Math.random()*st.lev.dur*10)/10};
      st.imgs.push(it);sel=it.id;n++;
    }catch(e){status('No se pudo leer «'+f.name+'».');}
  }
  drawLayer();refreshPanel();save();
}

  return t.innerHTML;
}
function pathOf(el){const r=root(),p=[];let n=el;while(n&&n!==r&&n.parentElement){p.unshift(n.localName+':nth-child('+([...n.parentElement.children].indexOf(n)+1)+')');n=n.parentElement;}return p.join('>');}
function elByPath(p){try{return root().querySelector(':scope>'+p);}catch(e){return null;}}
function curO(create){
  if(!selPath)return null;if(!st.ovr)st.ovr={};
  let w=st.ovr[selKey];if(!w){if(!create)return null;w=st.ovr[selKey]={};}
  if(!w[selPath]){if(!create)return null;w[selPath]={};}
  return w[selPath];
}
function prune(){const w=st.ovr&&st.ovr[selKey];if(w&&w[selPath]&&!Object.keys(w[selPath]).length)delete w[selPath];if(w&&!Object.keys(w).length)delete st.ovr[selKey];}
function ensureOrig(el){
  if(!el._lbo)el._lbo={d:el.style.getPropertyValue('display'),dp:el.style.getPropertyPriority('display'),tr:el.style.getPropertyValue('translate'),sc:el.style.getPropertyValue('scale'),br:el.style.borderRadius,fs:el.style.fontSize,tb:el.style.transformBox,to:el.style.transformOrigin};
  return el._lbo;
}
function applyOne(el,o){
  const q=ensureOrig(el);
  if(o.t!==undefined){if(q.h===undefined)q.h=el.innerHTML;const c=cleanHTML(o.t);if(el.innerHTML!==c)el.innerHTML=c;}
  if(o.h)el.style.setProperty('display','none','important');else el.style.setProperty('display',q.d,q.dp);
  const tx=o.tx||0,ty=o.ty||0,sx=o.sx||1,sy=o.sy||1,mv=tx||ty,sc=sx!==1||sy!==1;
  el.style.setProperty('translate',mv?tx+'px '+ty+'px':q.tr);
  el.style.setProperty('scale',sc?sx+' '+sy:q.sc);
  if((mv||sc)&&el instanceof SVGElement){el.style.transformBox='fill-box';el.style.transformOrigin='center';}
  else{el.style.transformBox=q.tb;el.style.transformOrigin=q.to;}
  el.style.borderRadius=o.r!==undefined?o.r+'px':q.br;
  el.style.fontSize=o.fs!==undefined?o.fs+'px':q.fs;
}
function resetEl(el){
  const q=el._lbo;if(!q)return;
  el.style.setProperty('display',q.d,q.dp);el.style.setProperty('translate',q.tr);el.style.setProperty('scale',q.sc);
  el.style.borderRadius=q.br;el.style.fontSize=q.fs;el.style.transformBox=q.tb;el.style.transformOrigin=q.to;
  if(q.h!==undefined&&el.innerHTML!==q.h)el.innerHTML=q.h;
  delete el._lbo;
}
function applyOvr(){
  const w=(st.ovr||{})[ovKey()];
  if(w)Object.keys(w).sort((a,b)=>a.length-b.length).forEach(p=>{const el=elByPath(p);if(el)applyOne(el,w[p]);});
  if(selPath){if(selKey===ovKey()){selEl=elByPath(selPath);if(selEl)selEl.style.touchAction='none';}else clearEl();}
}
function selectEl(el){
  if(selEl&&selEl!==el)selEl.style.touchAction='';
  selEl=el;selPath=pathOf(el);selKey=ovKey();el.style.touchAction='none';
  if(sel){sel=null;drawLayer();}
  refreshPanel();
}
function clearEl(){
  if(editEl)finishEdit();
  if(selEl)selEl.style.touchAction='';
  selEl=null;selPath=null;selKey=null;hl.hidden=true;
}
function pickFrom(t){
  if(selEl&&selEl!==t&&selEl.contains(t)){let n=t;while(n.parentElement&&n.parentElement!==selEl)n=n.parentElement;return n;}
  let top=t,n=t;while(n&&n!==root()){if(n.localName==='svg'&&n instanceof SVGElement)top=n;n=n.parentElement;}
  return top;
}
const lockOn=()=>$('#lb-elk').checked;
const rnd2=v=>Math.round(v*100)/100, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function startMove(ev,mode){
  if(!selEl)return;const o=curO(false)||{},r=selEl.getBoundingClientRect();
  edrag={mode:mode||'move',sx:ev.clientX,sy:ev.clientY,tx:o.tx||0,ty:o.ty||0,kx:o.sx||1,ky:o.sy||1,w:r.width||1,h:r.height||1,moved:false};
}
document.addEventListener('pointerdown',ev=>{
  if(!edit||!pick)return;
  const t=ev.target;if(!t.closest)return;
  if(editEl&&editEl.contains(t))return;
  if(!t.closest('#root')||t===root()){
    if(!t.closest('#lb-panel,#lb-hl,#lb-fab,.lbi,#lb-ui')&&selEl){clearEl();refreshPanel();}
    return;
  }
  if(editEl){finishEdit();}
  ev.preventDefault();ev.stopPropagation();
  const el=pickFrom(t);if(el!==selEl)selectEl(el);
  startMove(ev);
},true);
document.addEventListener('click',ev=>{
  if(!edit||!pick)return;const t=ev.target;
  if(!t.closest||!t.closest('#root')||t===root()||(editEl&&editEl.contains(t)))return;
  ev.preventDefault();ev.stopPropagation();
},true);
hl.addEventListener('pointerdown',ev=>{const m=ev.target.dataset&&ev.target.dataset.hm;if(!m||!selEl)return;ev.preventDefault();ev.stopPropagation();startMove(ev,m);});
window.addEventListener('pointermove',ev=>{
  if(!edrag||!selEl)return;
  const dx=ev.clientX-edrag.sx,dy=ev.clientY-edrag.sy;
  if(!edrag.moved&&Math.abs(dx)+Math.abs(dy)<3)return;
  edrag.moved=true;const o=curO(true);
  if(edrag.mode==='move'){o.tx=Math.round(edrag.tx+dx);o.ty=Math.round(edrag.ty+dy);}
  else{let a=1+2*dx/edrag.w,b=1+2*dy/edrag.h;if(lockOn())a=b=(a+b)/2;o.sx=clamp(rnd2(edrag.kx*a),.1,6);o.sy=clamp(rnd2(edrag.ky*b),.1,6);}
  applyOne(selEl,o);refreshEl();
});
function endE(){if(!edrag)return;const m=edrag.moved;edrag=null;if(m)save();}
window.addEventListener('pointerup',endE);window.addEventListener('pointercancel',endE);

function startEdit(){
  if(!selEl||editEl)return;
  const q=ensureOrig(selEl);if(q.h===undefined)q.h=selEl.innerHTML;
  editEl=selEl;editEl.setAttribute('contenteditable','true');editEl.focus();
  const g=window.getSelection(),r=document.createRange();r.selectNodeContents(editEl);r.collapse(false);g.removeAllRanges();g.addRange(r);
  refreshEl();
}
function finishEdit(){
  if(!editEl)return;const el=editEl;editEl=null;el.removeAttribute('contenteditable');
  if(el===selEl){const o=curO(true);o.t=cleanHTML(el.innerHTML);save();}
  refreshEl();
}
const hasText=el=>!!(el&&el.textContent&&el.textContent.trim());
function labelOf(el,p){
  if(!el)return p.split('>').pop();
  let t=(el.getAttribute&&(el.getAttribute('alt')||el.getAttribute('aria-label')))||el.textContent||'';
  t=t.trim().replace(/\s+/g,' ').slice(0,26);return el.localName+(t?' · '+t:'');
}
function refreshEl(){
  const pk=$('#lb-pk');if(!pk)return;
  pk.textContent=pick?'🎯 Seleccionar elementos: ACTIVADO':'🧭 Navegando (toca para seleccionar)';
  pk.className='lbb '+(pick?'y':'');
  $('#lb-pkn').textContent=pick?'Toca una imagen, sección o texto de la página. Toca otra vez dentro de lo seleccionado para bajar de nivel, o usa «Contenedor» para subir.':'La página funciona normal. Activa la selección para editar elementos.';
  const ok=!!(selEl&&selKey===ovKey()&&document.contains(selEl));
  $('#lb-esel').hidden=!ok;
  if(ok){
    const o=curO(false)||{},cs=getComputedStyle(selEl),svgp=selEl instanceof SVGElement&&selEl.localName!=='svg',tx=hasText(selEl);
    const set=(id,v,u)=>{$('#lb-'+id).value=v;$('#lb-'+id+'o').textContent=Math.round(v)+u;};
    set('ew',(o.sx||1)*100,' %');set('eh',(o.sy||1)*100,' %');set('ex',o.tx||0,' px');set('ey',o.ty||0,' px');
    set('er',o.r!==undefined?o.r:Math.min(200,parseFloat(cs.borderTopLeftRadius)||0),' px');
    $('#lb-er').disabled=svgp;
    set('ef',o.fs!==undefined?o.fs:(parseFloat(cs.fontSize)||16),' px');
    $('#lb-efl').hidden=!tx;$('#lb-ef').hidden=!tx;$('#lb-etx').hidden=!tx;
    $('#lb-etx').textContent=editEl?'✔ Terminar texto':'✎ Editar texto';
  }
  const ul=$('#lb-ovl');ul.textContent='';const w=(st.ovr||{})[ovKey()]||{},ks=Object.keys(w);
  if(!ks.length){const li=document.createElement('li');li.style.cssText='cursor:default;background:none';li.innerHTML='<p class="lbempty" style="width:100%">Aún no hay cambios en esta ventana.</p>';ul.appendChild(li);}
  ks.forEach(p=>{
    const el=elByPath(p),li=document.createElement('li');li.dataset.p=p;if(p===selPath)li.className='sel';
    const sp=document.createElement('span');sp.textContent=(w[p].h?'🗑 ':'')+labelOf(el,p)+(w[p].h?' (eliminado)':'');
    const b=document.createElement('button');b.type='button';b.dataset.op='undo';b.textContent='↺';b.title='Restablecer este elemento';b.setAttribute('aria-label','Restablecer este elemento');
    li.append(sp,b);ul.appendChild(li);
  });
}
function bindE(id,fn){$('#lb-'+id).addEventListener('input',e=>{if(!selEl)return;const o=curO(true);fn(o,+e.target.value);applyOne(selEl,o);refreshEl();save();});}
bindE('ew',(o,v)=>{o.sx=v/100;if(lockOn())o.sy=o.sx;});
bindE('eh',(o,v)=>{o.sy=v/100;if(lockOn())o.sx=o.sy;});
bindE('ex',(o,v)=>{o.tx=v;});bindE('ey',(o,v)=>{o.ty=v;});
bindE('er',(o,v)=>{o.r=v;});bindE('ef',(o,v)=>{o.fs=v;});
$('#lb-pk').addEventListener('click',()=>{pick=!pick;if(!pick)clearEl();document.body.classList.toggle('lb-pick',edit&&pick);refreshEl();});
$('#lb-up').addEventListener('click',()=>{if(!selEl)return;const p=selEl.parentElement;if(p&&p!==root())selectEl(p);});
$('#lb-etx').addEventListener('click',()=>{editEl?finishEdit():startEdit();});
$('#lb-edel').addEventListener('click',()=>{if(!selEl)return;if(editEl)finishEdit();const o=curO(true);o.h=1;applyOne(selEl,o);clearEl();refreshPanel();save();});
$('#lb-ers').addEventListener('click',()=>{
  if(!selEl)return;if(editEl){editEl.removeAttribute('contenteditable');editEl=null;}
  resetEl(selEl);const w=st.ovr&&st.ovr[selKey];if(w)delete w[selPath];prune();refreshEl();save();
});
$('#lb-ovl').addEventListener('click',e=>{
  const li=e.target.closest('li[data-p]');if(!li)return;const p=li.dataset.p,k=ovKey(),el=elByPath(p),w=st.ovr&&st.ovr[k];
  if(e.target.dataset.op==='undo'){if(el)resetEl(el);if(w)delete w[p];if(w&&!Object.keys(w).length)delete st.ovr[k];if(p===selPath)clearEl();refreshPanel();save();}
  else if(el&&!(w&&w[p]&&w[p].h)){pick=true;document.body.classList.toggle('lb-pick',edit);selectEl(el);}
});
$('#lb-eall').addEventListener('click',()=>{clearEl();if(st.ovr)delete st.ovr[ovKey()];render();save();});
/* controles extra para las imágenes PNG añadidas */
function imgIn(id,fn){$('#lb-'+id).addEventListener('input',e=>{const it=selItem();if(!it)return;fn(it,+e.target.value);applyItem(elOf(it.id),it);syncSliders();save();});}
imgIn('px',(it,v)=>{it.x=v;});imgIn('py',(it,v)=>{it.y=v;});imgIn('cv',(it,v)=>{it.rad=v;});
$('#lb-idel').addEventListener('click',()=>{const it=selItem();if(!it)return;st.imgs=st.imgs.filter(i=>i.id!==it.id);sel=null;drawLayer();refreshPanel();save();});
function loop(){
  if(edit&&selEl&&selKey===ovKey()&&document.contains(selEl)&&getComputedStyle(selEl).display!=='none'){
    const r=selEl.getBoundingClientRect(),c='left:'+r.left+'px;top:'+r.top+'px;width:'+Math.max(r.width,6)+'px;height:'+Math.max(r.height,6)+'px';
    hl.hidden=false;if(hl._c!==c){hl.style.cssText=c;hl._c=c;}
  }else hl.hidden=true;
  raf=edit?requestAnimationFrame(loop):0;
}

/* ---------- Integración con la app ---------- */
const _render=render;
render=function(){if(editEl)finishEdit();_render();applyOvr();drawLayer();if(edit)refreshPanel();};

/* ---------- Arranque ---------- */
(async function init(){
  let emb=null;
  try{emb=normalize(JSON.parse($('#lb-data').textContent||'null'));}catch(e){}
  let loc=null;
  try{loc=normalize(await idb.get('state'));}catch(e){}
  if(emb&&loc)st=(loc.savedAt>emb.savedAt)?loc:emb;else st=loc||emb||st;
  const pub=document.documentElement.dataset.lbPub&&!/[?&]editor|#editor/.test(location.href);
  if(pub){fab.hidden=true;}
  pubHide=!!document.documentElement.dataset.lbPub||pubHide;
  $('#lb-pub').checked=pubHide;
  applyOvr();drawLayer();
})();
})();
</script>
</body>
